[package]
name = "throttle"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
crossbeam-channel = "0.5.16"
eframe = "0.35.0"
egui_plot = "0.36.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
windivert = "0.6.0"
windivert-sys = "0.10.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-manifest = "1"
winresource = "0.1.31"
